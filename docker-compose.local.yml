# Local development stack.
#
# The host compiles the Linux binaries with `make dev-build` (zig cross-compile,
# musl target). The api and worker containers only RUN those binaries from
# ./bin on alpine, so no Go toolchain, module cache or build cache lives inside
# a container.
#
# Start order:
#   1. make dev-build
#   2. docker compose -f docker-compose.local.yml up -d
# After a code change run `make dev`, which rebuilds and restarts both services.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "8322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  api:
    image: alpine:3.21
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["/app/bin/charon_linux_arm64"]
    env_file:
      - .env.docker
    environment:
      PORT: "2121"
      BASEURL: "0.0.0.0"
      CORS_ALLOW_ORIGINS: "http://localhost:8321,http://localhost:8320"
      PHONE_COUNTRY_CODE: "90"
      CHARON_ENABLE_WEBSOCKET_INCOMING_MSG: "false"
      CHARON_ENABLE_WEBHOOK: "false"
      CHARON_TYPING_DELAY_MIN: "1"
      CHARON_TYPING_DELAY_MAX: "3"
      ALLOW_9_DIGIT_PHONE_NUMBER: "false"
      COOKIE_SECURE: "false"
      SESSION_EXPIRY: 168h
      RATE_LIMIT_PER_SECOND: "10"
      RATE_LIMIT_BURST: "10"
      RATE_LIMIT_WINDOW_MINUTES: "3"
      MAX_FILE_SIZE_IMAGE_MB: "5"
      MAX_FILE_SIZE_VIDEO_MB: "16"
      MAX_FILE_SIZE_AUDIO_MB: "16"
      MAX_FILE_SIZE_DOCUMENT_MB: "100"
      UPLOAD_DIR: ./uploads
      MAX_AVATAR_SIZE_MB: "1"
      ALLOWED_AVATAR_TYPES: jpg,jpeg,png,webp,ico
      WARMING_WORKER_ENABLED: "false"
      WARMING_WORKER_INTERVAL_SECONDS: "5"
      WARMING_AUTO_REPLY_ENABLED: "false"
      WARMING_AUTO_REPLY_COOLDOWN: "60"
      AI_ENABLED: "false"
      AI_DEFAULT_PROVIDER: gemini
      GEMINI_API_KEY: ""
      GEMINI_DEFAULT_MODEL: gemini-flash-latest
      AI_CONVERSATION_HISTORY_LIMIT: "10"
      AI_DEFAULT_TEMPERATURE: "0.7"
      AI_DEFAULT_MAX_TOKENS: "150"
    volumes:
      - ./bin:/app/bin:ro
      - ./web/dist:/app/web/dist:ro
      - ./docker-data/uploads:/app/uploads
    ports:
      - "8320:2121"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2121/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    image: alpine:3.21
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["/app/bin/worker_linux_arm64"]
    env_file:
      - .env.docker
    environment:
      OUTBOX_API_BASEURL: http://api:2121
    volumes:
      - ./bin:/app/bin:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker_linux || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    image: node:22-alpine
    working_dir: /app/web
    environment:
      VITE_API_URL: http://api:2121
      VITE_WS_URL: ws://api:2121
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app/web
      - ./docker-data/node-modules:/app/web/node_modules
    ports:
      - "8321:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
